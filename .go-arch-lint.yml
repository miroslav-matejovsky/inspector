version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"
  - "test"
  - "vendor"
  - ".tmp"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"

# Third-party packages that components may use via 'canUse'.
# Example for a real project:
#
# vendors:
#   x-sync: { in: "golang.org/x/sync/**" }
#   ergo:   { in: "ergo.services/ergo/**" }
vendors:
  prometheus: { in: "github.com/prometheus/**" }

# Inspector library components (observation, navigation, connectivity,
# representation, and later explanation) list only other library components
# in mayDependOn, never a harness component: the library knows no inspected
# system. Every Go package must be mapped to a component; go-arch-lint fails
# on files that are not attached to one. Vocabulary is checked by task boundary.
components:
  cmd: { in: cmd/** }
  observation: { in: observation }
  navigation: { in: navigation }
  connectivity: { in: connectivity }
  representation: { in: representation }
  explanation: { in: explanation }
  workbench: { in: harness/workbench }
  adapter: { in: harness/adapter }
  fulfillment: { in: harness/inspected/fulfillment }
  simulation: { in: harness/inspected/simulation }
  metrics: { in: harness/inspected/metrics }
  health: { in: harness/inspected/health }
  inspected: { in: harness/inspected }
  # Example for a real project, one entry per domain package:
  #
  # orders:   { in: internal/orders }
  # billing:  { in: internal/billing }
  # platform: { in: internal/platform/** }

deps:
  # cmd is the composition root: it wires all components and vendors together.
  cmd:
    anyProjectDeps: true
    anyVendorDeps: true
  navigation:
    mayDependOn: [observation]
  explanation:
    mayDependOn: [observation]
  representation:
    mayDependOn: [observation, navigation, explanation]
  workbench:
    mayDependOn: [inspected, adapter, connectivity, representation]
  adapter:
    mayDependOn: [observation, connectivity]
  simulation:
    mayDependOn: [fulfillment]
  metrics:
    mayDependOn: [fulfillment]
    canUse: [prometheus]
  health:
    mayDependOn: [fulfillment]
  inspected:
    mayDependOn: [fulfillment, simulation, metrics, health]
    canUse: [prometheus]
  # Example for a real project, each component lists what it may import:
  #
  # orders:
  #   mayDependOn: [platform]
  #   canUse: [ergo]
  # billing:
  #   mayDependOn: [orders, platform]
  #   canUse: [ergo, x-sync]
  # platform:
  #   canUse: [x-sync]

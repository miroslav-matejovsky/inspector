version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "examples"
  - "test"
  - "vendor"
  - ".tmp"

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*\/test\/.*$"

# Third-party packages that components may use via 'canUse'.
# Example for a real project:
#
# vendors:
#   x-sync: { in: "golang.org/x/sync/**" }
#   ergo:   { in: "ergo.services/ergo/**" }
vendors:
  prometheus: { in: "github.com/prometheus/**" }
  sqlite: { in: "github.com/ncruces/go-sqlite3/**" }

# Every Go package must be mapped to a component; go-arch-lint fails on files
# that are not attached to one.
components:
  cmd: { in: cmd/** }
  source: { in: source }
  signalstore: { in: internal/signalstore }
  logfile: { in: internal/logfile }
  view: { in: view }
  workbench: { in: harness/workbench }
  inspected: { in: harness/inspected }
  inspected-fulfillment: { in: harness/inspected/fulfillment }
  inspected-simulation: { in: harness/inspected/simulation }
  inspected-metrics: { in: harness/inspected/metrics }
  inspected-health: { in: harness/inspected/health }
  # Example for a real project, one entry per domain package:
  #
  # orders:   { in: internal/orders }
  # billing:  { in: internal/billing }
  # platform: { in: internal/platform/** }

deps:
  # cmd is the composition root: it wires all components and vendors together.
  cmd:
    anyProjectDeps: true
    anyVendorDeps: true
  source:
    mayDependOn: [signalstore]
  signalstore:
    canUse: [sqlite]
  view:
    mayDependOn: [source]
  workbench:
    mayDependOn: [inspected, source, view]
  inspected:
    mayDependOn: [inspected-fulfillment, inspected-simulation, inspected-metrics, inspected-health]
    canUse: [prometheus]
  inspected-simulation:
    mayDependOn: [inspected-fulfillment]
  inspected-metrics:
    mayDependOn: [inspected-fulfillment]
    canUse: [prometheus]
  inspected-health:
    mayDependOn: [inspected-fulfillment]
  # Example for a real project, each component lists what it may import:
  #
  # orders:
  #   mayDependOn: [platform]
  #   canUse: [ergo]
  # billing:
  #   mayDependOn: [orders, platform]
  #   canUse: [ergo, x-sync]
  # platform:
  #   canUse: [x-sync]

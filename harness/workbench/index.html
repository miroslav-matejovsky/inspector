<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{.RefreshSeconds}}">
<title>Inspector Workbench</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d0d0d7;
    --text: #1c1c22;
    --muted: #6b6b76;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1f1f25;
      --border: #34343d;
      --text: #ececf1;
      --muted: #8d8d99;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .panel h2 {
    margin: 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .panel .content { flex: 1; padding: 12px; overflow: auto; }
  pre { margin: 0; font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
  <section class="panel" id="workbench">
    <h2>Workbench</h2>
    <div class="content"><pre id="signals">{{.Signals}}</pre></div>
  </section>
</body>
</html>

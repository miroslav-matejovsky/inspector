<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<noscript><meta http-equiv="refresh" content="{{.RefreshSeconds}}"></noscript>
<title>Inspector Workbench</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d0d0d7;
    --text: #1c1c22;
    --muted: #6b6b76;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1f1f25;
      --border: #34343d;
      --text: #ececf1;
      --muted: #8d8d99;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    padding: 12px;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .panel header {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel h2 {
    flex: 1;
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .panel .content { flex: 1; min-height: 0; padding: 12px; overflow: auto; }
  #refresh-status:empty { display: none; }
  .tabs { display: flex; gap: 4px; }
  .tabs a {
    padding: 2px 10px;
    border-radius: 4px;
    color: var(--muted);
    text-decoration: none;
  }
  .tabs a.active { background: var(--bg); color: var(--text); font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0; }
  .controls form { display: flex; gap: 4px; align-items: center; margin: 0; }
  .controls .dependency { margin-right: 2px; font-size: 12px; color: var(--muted); }
  .controls button {
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font: 12px system-ui, sans-serif;
    cursor: pointer;
  }
  .controls button.mode-healthy { --mode: #1a7f37; }
  .controls button.mode-slow { --mode: #9a6700; }
  .controls button.mode-outage { --mode: #cf222e; }
  .controls button:hover { border-color: var(--mode); }
  .controls button.active {
    border-color: var(--mode);
    background: var(--mode);
    color: #ffffff;
    font-weight: 600;
    cursor: default;
  }
  .error { margin: 0; font: 12px/1.4 ui-monospace, monospace; color: #cf222e; }
</style>
{{range .Styles}}<style>{{.}}</style>{{end}}
</head>
<body data-refresh-seconds="{{.RefreshSeconds}}">
  <section class="panel" id="workbench">
    <header>
      <h2>Workbench</h2>
      <nav class="tabs">{{range .Tabs}}<a href="{{.Path}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Label}}</a>{{end}}</nav>
      <span id="refresh-status" class="error"></span>
      <div class="controls">
        {{- if .ControlsError}}
        <span class="error">{{.ControlsError}}</span>
        {{- end}}
        {{- range .Controls}}
        <form method="post" action="/controls/dependencies/{{.Name}}"><span class="dependency">{{.Name}}</span><input type="hidden" name="return" value="{{$.Return}}">
          {{- range .Buttons}}<button name="mode" value="{{.Mode}}" class="mode-{{.Mode}}{{if .Active}} active{{end}}" aria-pressed="{{.Active}}">{{.Mode}}</button>{{end -}}
        </form>
        {{- end}}
      </div>
    </header>
    <div class="content" id="signals" data-scroll="content">{{if .Error}}<pre class="error">{{.Error}}</pre>{{else}}{{.View}}{{end}}</div>
  </section>
<script>
// The panel is replaced in place with the panel of a fresh GET of the current
// page every data-refresh-seconds, so the page never reloads. Scroll positions
// of the elements with a data-scroll key survive the swap. The control forms
// are sent with fetch; their 303 leads to GET of the page given by the form
// value return, whose panel is shown the same way. A response that starts
// before the last shown one is dropped, so a slow refresh never undoes a mode
// change.
(() => {
  const refreshMs = Number(document.body.dataset.refreshSeconds) * 1000;
  let started = 0;
  let shown = 0;

  const panel = () => document.getElementById("workbench");

  function fail(message) {
    const status = document.getElementById("refresh-status");
    if (status) status.textContent = message;
  }

  function show(html) {
    const next = new DOMParser().parseFromString(html, "text/html").getElementById("workbench");
    if (!next) throw new Error("response has no workbench panel");
    const scrolls = new Map();
    for (const el of panel().querySelectorAll("[data-scroll]")) {
      scrolls.set(el.dataset.scroll, [el.scrollTop, el.scrollLeft]);
    }
    panel().replaceWith(next);
    for (const el of next.querySelectorAll("[data-scroll]")) {
      const pos = scrolls.get(el.dataset.scroll);
      if (pos) [el.scrollTop, el.scrollLeft] = pos;
    }
  }

  // load shows the panel of the response to request. Every page is HTML,
  // also one with status 500; a rejected control answers plain text, which
  // is shown as the error.
  async function load(request) {
    const id = ++started;
    try {
      const res = await request();
      const text = await res.text();
      if (id < shown) return;
      shown = id;
      if (!(res.headers.get("Content-Type") || "").startsWith("text/html")) {
        throw new Error(text.trim());
      }
      show(text);
    } catch (err) {
      if (id >= shown) fail("refresh failed: " + err.message);
    }
  }

  async function refresh() {
    await load(() => fetch(location.pathname + location.search, { cache: "no-store" }));
    setTimeout(refresh, refreshMs);
  }

  document.addEventListener("submit", (e) => {
    const form = e.target.closest("#workbench form");
    if (!form) return;
    e.preventDefault();
    const body = new URLSearchParams(new FormData(form, e.submitter));
    load(() => fetch(form.action, { method: "POST", body }));
  });

  setTimeout(refresh, refreshMs);
})();
</script>
</body>
</html>
